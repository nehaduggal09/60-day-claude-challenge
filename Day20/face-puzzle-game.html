<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Puzzle Game</title>
<style>
  :root{
    --bg1:#1e1b4b;
    --bg2:#312e81;
    --accent:#f472b6;
    --accent2:#38bdf8;
    --green:#22c55e;
    --panel:rgba(255,255,255,0.06);
    --panel-border:rgba(255,255,255,0.15);
    --text:#f1f5f9;
    --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100vh;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 60%,#4c1d95);
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 12px 60px;
  }
  h1{
    font-size:1.8rem;
    margin:8px 0 4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-align:center;
  }
  .subtitle{color:var(--muted);margin-bottom:20px;text-align:center;font-size:0.95rem;}
  .screen{
    width:100%;
    max-width:640px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .screen.active{display:flex;}
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:16px;
    padding:20px;
    width:100%;
    backdrop-filter:blur(6px);
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
  }
  video, #snapshotCanvas{
    width:100%;
    max-width:480px;
    border-radius:14px;
    background:#000;
    transform:scaleX(-1);
    display:block;
    margin:0 auto;
  }
  #snapshotCanvas{transform:none;}
  .btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:14px;
  }
  button{
    border:none;
    outline:none;
    cursor:pointer;
    font-weight:600;
    font-size:0.95rem;
    padding:12px 20px;
    border-radius:10px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    color:#0f172a;
  }
  button:active{transform:scale(0.96);}
  .btn-primary{
    background:linear-gradient(90deg,var(--accent),#ec4899);
    color:white;
  }
  .btn-secondary{
    background:linear-gradient(90deg,var(--accent2),#0ea5e9);
    color:white;
  }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--text);
  }
  .btn-green{
    background:linear-gradient(90deg,#22c55e,#16a34a);
    color:white;
  }
  button:disabled{opacity:0.4;cursor:not-allowed;}
  .diff-row{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .diff-btn{
    padding:14px 22px;
    border-radius:12px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    font-size:1rem;
    min-width:90px;
  }
  .diff-btn.selected{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:white;
    border-color:transparent;
  }
  .status-bar{
    display:flex;
    justify-content:space-between;
    width:100%;
    max-width:520px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:10px 18px;
    font-size:0.9rem;
    flex-wrap:wrap;
    gap:8px;
  }
  .status-item{display:flex;flex-direction:column;align-items:center;min-width:70px;}
  .status-item span:first-child{color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;}
  .status-item span:last-child{font-size:1.1rem;font-weight:700;}
  #puzzleWrap{
    position:relative;
    width:100%;
    max-width:480px;
    aspect-ratio:1/1;
    margin:0 auto;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    border:2px solid var(--panel-border);
    touch-action:none;
    user-select:none;
  }
  .piece{
    position:absolute;
    box-sizing:border-box;
    border:2px solid rgba(255,255,255,0.15);
    background-repeat:no-repeat;
    cursor:grab;
    transition:box-shadow .15s ease;
    will-change:transform;
  }
  .piece.dragging{
    cursor:grabbing;
    z-index:50;
    border:3px solid var(--accent);
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
  }
  .piece.correct{
    border:3px solid var(--green);
    box-shadow:0 0 10px rgba(34,197,94,0.6);
  }
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:16px;
  }
  .overlay.active{display:flex;}
  .result-card{
    background:linear-gradient(160deg,#1e293b,#312e81);
    border:1px solid var(--panel-border);
    border-radius:18px;
    padding:28px;
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .result-card h2{
    margin-top:0;
    font-size:1.6rem;
    background:linear-gradient(90deg,#facc15,var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .result-stats{
    display:flex;
    justify-content:space-around;
    margin:18px 0;
    flex-wrap:wrap;
    gap:10px;
  }
  .result-stats div{display:flex;flex-direction:column;}
  .result-stats span:first-child{color:var(--muted);font-size:0.75rem;text-transform:uppercase;}
  .result-stats span:last-child{font-size:1.3rem;font-weight:700;}
  .leaderboard{
    text-align:left;
    margin-top:16px;
    background:rgba(0,0,0,0.25);
    border-radius:12px;
    padding:12px 14px;
    max-height:200px;
    overflow-y:auto;
  }
  .leaderboard h3{margin:0 0 8px;font-size:0.95rem;color:var(--accent2);}
  .lb-row{
    display:flex;
    justify-content:space-between;
    font-size:0.85rem;
    padding:4px 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-empty{color:var(--muted);font-size:0.85rem;}
  .error-box{
    background:rgba(239,68,68,0.15);
    border:1px solid rgba(239,68,68,0.4);
    color:#fecaca;
    padding:14px 16px;
    border-radius:10px;
    font-size:0.9rem;
    line-height:1.4;
  }
  .hint{color:var(--muted);font-size:0.85rem;text-align:center;}
  .progress-track{
    width:100%;
    max-width:480px;
    height:8px;
    background:rgba(255,255,255,0.1);
    border-radius:6px;
    overflow:hidden;
    margin-top:6px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent2),var(--green));
    transition:width .3s ease;
  }
  @media (max-width:520px){
    h1{font-size:1.4rem;}
    .status-item{min-width:60px;}
  }
</style>
</head>
<body>

<h1>🧩 Face Puzzle Game</h1>
<p class="subtitle">Snap a selfie, scramble it, and race to piece your face back together.</p>

<!-- SCREEN 1: CAMERA -->
<div class="screen active" id="screen-camera">
  <div class="panel">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="snapshotCanvas" style="display:none;"></canvas>
    <div id="cameraError"></div>
    <div class="btn-row">
      <button class="btn-primary" id="btnTakePhoto">📸 Take Photo</button>
      <button class="btn-ghost" id="btnRetake" style="display:none;">🔄 Retake Photo</button>
    </div>
  </div>
</div>

<!-- SCREEN 2: DIFFICULTY -->
<div class="screen" id="screen-difficulty">
  <div class="panel">
    <canvas id="previewCanvas" style="width:100%;max-width:300px;border-radius:12px;display:block;margin:0 auto 16px;"></canvas>
    <p class="hint">Choose your difficulty</p>
    <div class="diff-row">
      <button class="diff-btn" data-size="3">3 × 3<br><span style="font-size:0.75rem;color:var(--muted)">Easy</span></button>
      <button class="diff-btn" data-size="4">4 × 4<br><span style="font-size:0.75rem;color:var(--muted)">Medium</span></button>
      <button class="diff-btn" data-size="5">5 × 5<br><span style="font-size:0.75rem;color:var(--muted)">Hard</span></button>
    </div>
    <div class="btn-row">
      <button class="btn-ghost" id="btnBackToCamera">← New Photo</button>
      <button class="btn-primary" id="btnStartPuzzle" disabled>Start Puzzle →</button>
    </div>
  </div>
</div>

<!-- SCREEN 3: PUZZLE -->
<div class="screen" id="screen-puzzle">
  <div class="status-bar">
    <div class="status-item"><span>Time</span><span id="statTime">00:00.0</span></div>
    <div class="status-item"><span>Moves</span><span id="statMoves">0</span></div>
    <div class="status-item"><span>Placed</span><span id="statPlaced">0/0</span></div>
    <div class="status-item"><span>Grid</span><span id="statGrid">-</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div id="puzzleWrap"></div>
  <div class="btn-row">
    <button class="btn-ghost" id="btnNewPhotoFromPuzzle">📷 New Photo</button>
    <button class="btn-secondary" id="btnRestartPuzzle">🔀 Reshuffle</button>
  </div>
</div>

<!-- WIN OVERLAY -->
<div class="overlay" id="winOverlay">
  <div class="result-card">
    <h2>🎉 Puzzle Solved!</h2>
    <div class="result-stats">
      <div><span>Time</span><span id="resTime">00:00.0</span></div>
      <div><span>Moves</span><span id="resMoves">0</span></div>
      <div><span>Grid</span><span id="resGrid">-</span></div>
    </div>
    <div class="leaderboard">
      <h3>🏆 Best Times</h3>
      <div id="leaderboardList"><div class="lb-empty">No records yet.</div></div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btnPlayAgain">🔁 Play Again</button>
      <button class="btn-secondary" id="btnNewPhotoFromWin">📷 New Photo</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- State ----------
  let stream = null;
  let faceImage = null;         // HTMLImageElement of captured face
  let gridSize = 3;
  let pieces = [];              // {id, correctRow, correctCol, curRow, curCol, el}
  let cellSize = 0;
  let timerInterval = null;
  let startTime = null;
  let elapsedMs = 0;
  let moveCount = 0;
  let gameActive = false;
  let dragState = null;

  // ---------- DOM ----------
  const video = document.getElementById('video');
  const snapshotCanvas = document.getElementById('snapshotCanvas');
  const previewCanvas = document.getElementById('previewCanvas');
  const cameraError = document.getElementById('cameraError');
  const btnTakePhoto = document.getElementById('btnTakePhoto');
  const btnRetake = document.getElementById('btnRetake');
  const btnBackToCamera = document.getElementById('btnBackToCamera');
  const btnStartPuzzle = document.getElementById('btnStartPuzzle');
  const btnNewPhotoFromPuzzle = document.getElementById('btnNewPhotoFromPuzzle');
  const btnRestartPuzzle = document.getElementById('btnRestartPuzzle');
  const btnPlayAgain = document.getElementById('btnPlayAgain');
  const btnNewPhotoFromWin = document.getElementById('btnNewPhotoFromWin');
  const puzzleWrap = document.getElementById('puzzleWrap');
  const statTime = document.getElementById('statTime');
  const statMoves = document.getElementById('statMoves');
  const statPlaced = document.getElementById('statPlaced');
  const statGrid = document.getElementById('statGrid');
  const progressFill = document.getElementById('progressFill');
  const winOverlay = document.getElementById('winOverlay');
  const resTime = document.getElementById('resTime');
  const resMoves = document.getElementById('resMoves');
  const resGrid = document.getElementById('resGrid');
  const leaderboardList = document.getElementById('leaderboardList');

  const screens = {
    camera: document.getElementById('screen-camera'),
    difficulty: document.getElementById('screen-difficulty'),
    puzzle: document.getElementById('screen-puzzle')
  };

  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // ---------- Camera ----------
  async function initCamera(){
    cameraError.innerHTML = '';
    video.style.display = 'block';
    snapshotCanvas.style.display = 'none';
    btnTakePhoto.style.display = 'inline-block';
    btnRetake.style.display = 'none';

    try{
      if(stream){
        stream.getTracks().forEach(t => t.stop());
      }
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width:{ideal:640}, height:{ideal:640} },
        audio: false
      });
      video.srcObject = stream;
    }catch(err){
      let msg = "Couldn't access your camera.";
      if(err && err.name === 'NotAllowedError'){
        msg = "Camera permission was denied. Please allow camera access in your browser settings and reload the page.";
      }else if(err && err.name === 'NotFoundError'){
        msg = "No camera device was found on this device.";
      }else if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
        msg = "Camera access requires HTTPS (or localhost). Please load this page over a secure connection.";
      }
      cameraError.innerHTML = `<div class="error-box">⚠️ ${msg}</div>`;
      btnTakePhoto.disabled = true;
    }
  }

  btnTakePhoto.addEventListener('click', () => {
    const size = Math.min(video.videoWidth, video.videoHeight) || 480;
    snapshotCanvas.width = size;
    snapshotCanvas.height = size;
    const ctx = snapshotCanvas.getContext('2d');
    const sx = (video.videoWidth - size) / 2;
    const sy = (video.videoHeight - size) / 2;
    ctx.save();
    ctx.translate(size, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
    ctx.restore();

    video.style.display = 'none';
    snapshotCanvas.style.display = 'block';
    btnTakePhoto.style.display = 'none';
    btnRetake.style.display = 'inline-block';

    const dataUrl = snapshotCanvas.toDataURL('image/png');
    faceImage = new Image();
    faceImage.onload = () => {
      goToDifficultyScreen();
    };
    faceImage.src = dataUrl;
  });

  btnRetake.addEventListener('click', () => {
    video.style.display = 'block';
    snapshotCanvas.style.display = 'none';
    btnTakePhoto.style.display = 'inline-block';
    btnRetake.style.display = 'none';
  });

  btnBackToCamera.addEventListener('click', () => {
    showScreen('camera');
    initCamera();
  });

  function goToDifficultyScreen(){
    showScreen('difficulty');
    const pctx = previewCanvas.getContext('2d');
    previewCanvas.width = 300;
    previewCanvas.height = 300;
    pctx.drawImage(faceImage, 0, 0, 300, 300);
  }

  // ---------- Difficulty selection ----------
  let selectedSize = null;
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSize = parseInt(btn.dataset.size, 10);
      btnStartPuzzle.disabled = false;
    });
  });

  btnStartPuzzle.addEventListener('click', () => {
    gridSize = selectedSize;
    showScreen('puzzle');
    buildPuzzle();
  });

  // ---------- Puzzle building ----------
  function buildPuzzle(){
    puzzleWrap.innerHTML = '';
    pieces = [];
    moveCount = 0;
    elapsedMs = 0;
    gameActive = false;
    statMoves.textContent = '0';
    statGrid.textContent = `${gridSize}×${gridSize}`;
    resGrid.textContent = `${gridSize}×${gridSize}`;
    progressFill.style.width = '0%';

    const wrapRect = puzzleWrap.getBoundingClientRect();
    const wrapSize = wrapRect.width || 480;
    cellSize = wrapSize / gridSize;

    const total = gridSize * gridSize;
    const positions = [];
    for(let r=0;r<gridSize;r++){
      for(let c=0;c<gridSize;c++){
        positions.push({r,c});
      }
    }
    let shuffled = positions.slice();
    let solved;
    do{
      shuffled = shuffleArray(positions.slice());
      solved = shuffled.every((p,i) => p.r === positions[i].r && p.c === positions[i].c);
    }while(solved && total > 1);

    for(let i=0;i<total;i++){
      const correct = positions[i];
      const start = shuffled[i];
      const piece = document.createElement('div');
      piece.className = 'piece';
      piece.style.width = cellSize + 'px';
      piece.style.height = cellSize + 'px';
      piece.style.backgroundImage = `url(${faceImage.src})`;
      piece.style.backgroundSize = `${wrapSize}px ${wrapSize}px`;
      piece.style.backgroundPosition = `-${correct.c * cellSize}px -${correct.r * cellSize}px`;
      positionPiece(piece, start.r, start.c);

      const pieceObj = {
        id: i,
        correctRow: correct.r,
        correctCol: correct.c,
        curRow: start.r,
        curCol: start.c,
        el: piece
      };
      piece.dataset.id = i;
      attachDragHandlers(piece, pieceObj);
      puzzleWrap.appendChild(piece);
      pieces.push(pieceObj);
    }

    updatePlacedCount();
    startTimer();
    gameActive = true;
  }

  function shuffleArray(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function positionPiece(el, row, col){
    el.style.left = (col * cellSize) + 'px';
    el.style.top = (row * cellSize) + 'px';
  }

  // ---------- Drag & touch handling ----------
  function attachDragHandlers(el, pieceObj){
    el.addEventListener('mousedown', (e) => startDrag(e, pieceObj, false));
    el.addEventListener('touchstart', (e) => startDrag(e, pieceObj, true), {passive:false});
  }

  function startDrag(e, pieceObj, isTouch){
    if(!gameActive) return;
    e.preventDefault();
    const point = isTouch ? e.touches[0] : e;
    const wrapRect = puzzleWrap.getBoundingClientRect();

    dragState = {
      piece: pieceObj,
      offsetX: point.clientX - (wrapRect.left + pieceObj.curCol * cellSize),
      offsetY: point.clientY - (wrapRect.top + pieceObj.curRow * cellSize)
    };
    pieceObj.el.classList.add('dragging');
    pieceObj.el.style.zIndex = 50;

    const moveHandler = isTouch ? onTouchMove : onMouseMove;
    const upHandler = isTouch ? onTouchEnd : onMouseUp;
    document.addEventListener(isTouch ? 'touchmove' : 'mousemove', moveHandler, {passive:false});
    document.addEventListener(isTouch ? 'touchend' : 'mouseup', upHandler);

    dragState.moveHandler = moveHandler;
    dragState.upHandler = upHandler;
    dragState.isTouch = isTouch;
  }

  function onMouseMove(e){ dragMove(e.clientX, e.clientY, e); }
  function onTouchMove(e){
    if(e.touches && e.touches[0]){
      dragMove(e.touches[0].clientX, e.touches[0].clientY, e);
    }
  }

  function dragMove(clientX, clientY, e){
    if(!dragState) return;
    e.preventDefault && e.preventDefault();
    const wrapRect = puzzleWrap.getBoundingClientRect();
    let x = clientX - wrapRect.left - dragState.offsetX;
    let y = clientY - wrapRect.top - dragState.offsetY;
    const maxPos = cellSize * gridSize - cellSize;
    x = Math.max(-cellSize*0.3, Math.min(maxPos + cellSize*0.3, x));
    y = Math.max(-cellSize*0.3, Math.min(maxPos + cellSize*0.3, y));
    dragState.piece.el.style.left = x + 'px';
    dragState.piece.el.style.top = y + 'px';
  }

  function onMouseUp(e){ endDrag(e.clientX, e.clientY); }
  function onTouchEnd(e){
    const point = (e.changedTouches && e.changedTouches[0]) || null;
    if(point) endDrag(point.clientX, point.clientY);
    else endDrag(null, null);
  }

  function endDrag(clientX, clientY){
    if(!dragState) return;
    const dragged = dragState.piece;
    dragged.el.classList.remove('dragging');

    document.removeEventListener(dragState.isTouch ? 'touchmove' : 'mousemove', dragState.moveHandler);
    document.removeEventListener(dragState.isTouch ? 'touchend' : 'mouseup', dragState.upHandler);

    const wrapRect = puzzleWrap.getBoundingClientRect();
    let targetCol, targetRow;
    if(clientX === null){
      targetCol = dragged.curCol;
      targetRow = dragged.curRow;
    }else{
      const relX = clientX - wrapRect.left;
      const relY = clientY - wrapRect.top;
      targetCol = Math.round(relX / cellSize - 0.5);
      targetRow = Math.round(relY / cellSize - 0.5);
      targetCol = Math.max(0, Math.min(gridSize - 1, targetCol));
      targetRow = Math.max(0, Math.min(gridSize - 1, targetRow));
    }

    const targetPiece = pieces.find(p => p !== dragged && p.curRow === targetRow && p.curCol === targetCol);

    if(targetPiece){
      const tmpRow = dragged.curRow, tmpCol = dragged.curCol;
      dragged.curRow = targetPiece.curRow;
      dragged.curCol = targetPiece.curCol;
      targetPiece.curRow = tmpRow;
      targetPiece.curCol = tmpCol;
      positionPiece(dragged.el, dragged.curRow, dragged.curCol);
      positionPiece(targetPiece.el, targetPiece.curRow, targetPiece.curCol);
      moveCount++;
      statMoves.textContent = moveCount;
      updateCorrectness(dragged);
      updateCorrectness(targetPiece);
    }else{
      positionPiece(dragged.el, dragged.curRow, dragged.curCol);
    }

    dragged.el.style.zIndex = '';
    dragState = null;
    updatePlacedCount();
    checkWin();
  }

  function updateCorrectness(pieceObj){
    if(pieceObj.curRow === pieceObj.correctRow && pieceObj.curCol === pieceObj.correctCol){
      pieceObj.el.classList.add('correct');
    }else{
      pieceObj.el.classList.remove('correct');
    }
  }

  function updatePlacedCount(){
    let count = 0;
    pieces.forEach(p => {
      updateCorrectness(p);
      if(p.curRow === p.correctRow && p.curCol === p.correctCol) count++;
    });
    const total = gridSize * gridSize;
    statPlaced.textContent = `${count}/${total}`;
    progressFill.style.width = `${(count/total)*100}%`;
  }

  // ---------- Timer ----------
  function startTimer(){
    startTime = performance.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      elapsedMs = performance.now() - startTime;
      statTime.textContent = formatTime(elapsedMs);
    }, 100);
  }

  function stopTimer(){
    clearInterval(timerInterval);
  }

  function formatTime(ms){
    const totalSec = ms / 1000;
    const mm = Math.floor(totalSec / 60);
    const ss = Math.floor(totalSec % 60);
    const tenths = Math.floor((ms % 1000) / 100);
    return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${tenths}`;
  }

  // ---------- Win detection ----------
  function checkWin(){
    const total = gridSize * gridSize;
    const allCorrect = pieces.every(p => p.curRow === p.correctRow && p.curCol === p.correctCol);
    if(allCorrect && total > 0){
      gameActive = false;
      stopTimer();
      showWinScreen();
    }
  }

  function showWinScreen(){
    resTime.textContent = formatTime(elapsedMs);
    resMoves.textContent = moveCount;
    resGrid.textContent = `${gridSize}×${gridSize}`;
    saveScore();
    renderLeaderboard();
    winOverlay.classList.add('active');
  }

  // ---------- Leaderboard (localStorage) ----------
  const LB_KEY = 'facePuzzleLeaderboard';

  function loadScores(){
    try{
      const raw = localStorage.getItem(LB_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function saveScore(){
    const scores = loadScores();
    scores.push({
      time: elapsedMs,
      moves: moveCount,
      difficulty: `${gridSize}×${gridSize}`,
      date: new Date().toLocaleDateString()
    });
    scores.sort((a,b) => a.time - b.time);
    const top5 = scores.slice(0, 5);
    try{
      localStorage.setItem(LB_KEY, JSON.stringify(top5));
    }catch(e){ /* storage unavailable, ignore */ }
  }

  function renderLeaderboard(){
    const scores = loadScores();
    if(scores.length === 0){
      leaderboardList.innerHTML = '<div class="lb-empty">No records yet.</div>';
      return;
    }
    leaderboardList.innerHTML = scores.map((s, idx) => `
      <div class="lb-row">
        <span>#${idx+1} ${s.difficulty}</span>
        <span>${formatTime(s.time)} · ${s.moves} moves</span>
        <span style="color:var(--muted)">${s.date}</span>
      </div>
    `).join('');
  }

  // ---------- Buttons ----------
  btnRestartPuzzle.addEventListener('click', () => {
    stopTimer();
    buildPuzzle();
  });

  btnPlayAgain.addEventListener('click', () => {
    winOverlay.classList.remove('active');
    buildPuzzle();
  });

  btnNewPhotoFromPuzzle.addEventListener('click', () => {
    stopTimer();
    gameActive = false;
    showScreen('camera');
    initCamera();
  });

  btnNewPhotoFromWin.addEventListener('click', () => {
    winOverlay.classList.remove('active');
    showScreen('camera');
    initCamera();
  });

  window.addEventListener('resize', () => {
    if(screens.puzzle.classList.contains('active') && pieces.length){
      const wrapRect = puzzleWrap.getBoundingClientRect();
      const wrapSize = wrapRect.width || 480;
      cellSize = wrapSize / gridSize;
      pieces.forEach(p => {
        p.el.style.width = cellSize + 'px';
        p.el.style.height = cellSize + 'px';
        p.el.style.backgroundSize = `${wrapSize}px ${wrapSize}px`;
        p.el.style.backgroundPosition = `-${p.correctCol * cellSize}px -${p.correctRow * cellSize}px`;
        positionPiece(p.el, p.curRow, p.curCol);
      });
    }
  });

  // ---------- Init ----------
  initCamera();
  renderLeaderboard();
})();
</script>
</body>
</html>
